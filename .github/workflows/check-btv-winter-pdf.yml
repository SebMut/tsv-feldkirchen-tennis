name: Verify official BTV Winter group PDF
on:
  push:
    branches: [feature/astro-supabase-foundation]
    paths: [scripts/check-btv-winter-pdf.mjs, .github/workflows/check-btv-winter-pdf.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils
      - run: node scripts/check-btv-winter-pdf.mjs
