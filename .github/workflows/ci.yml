name: Build Astro

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run Phase 4 regression tests
        run: npm test
      - name: Check and build
        run: npm run build
      - name: Audit generated site, links and SEO
        run: npm run audit:site
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsv-tennis-dist
          path: dist
  browser-qa:
    name: Chromium browser quality checks
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install isolated browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build local preview
        run: npm run build
      - name: Browser QA – desktop and mobile
        run: npm run qa:browser
        env:
          QA_ROLE_TICKER_EMAIL: ${{ secrets.QA_ROLE_TICKER_EMAIL }}
          QA_ROLE_TICKER_PASSWORD: ${{ secrets.QA_ROLE_TICKER_PASSWORD }}
          QA_ROLE_NEWS_EMAIL: ${{ secrets.QA_ROLE_NEWS_EMAIL }}
          QA_ROLE_NEWS_PASSWORD: ${{ secrets.QA_ROLE_NEWS_PASSWORD }}
          QA_ROLE_EVENTS_EMAIL: ${{ secrets.QA_ROLE_EVENTS_EMAIL }}
          QA_ROLE_EVENTS_PASSWORD: ${{ secrets.QA_ROLE_EVENTS_PASSWORD }}
      - name: Archive browser screenshots and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-quality-report
          path: artifacts/browser-qa/
          retention-days: 7
          if-no-files-found: warn
