name: Inspect Sommer 2026 unresolved BTV results
on:
  pull_request:
    paths:
      - 'scripts/inspect-2026-missing-results.mjs'
      - '.github/workflows/inspect-2026-missing-results.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node scripts/inspect-2026-missing-results.mjs
