name: Probe official winter team list (read-only)
on:
  push:
    branches: [feature/astro-supabase-foundation]
    paths: [scripts/probe-winter-teams.mjs, .github/workflows/probe-winter-teams.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/probe-winter-teams.mjs
