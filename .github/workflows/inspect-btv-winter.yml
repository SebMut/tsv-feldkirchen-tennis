name: Inspect official winter fixture links (read-only)
on:
  workflow_dispatch:
  push:
    branches: [feature/astro-supabase-foundation]
    paths: [scripts/inspect-btv-winter.mjs, .github/workflows/inspect-btv-winter.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 0
            kind: plan
          - index: 1
            kind: plan
          - index: 2
            kind: plan
          - index: 0
            kind: portrait
          - index: 1
            kind: portrait
          - index: 2
            kind: portrait
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Inspect public BTV widget
        env:
          BTV_LINK_KIND: ${{ matrix.kind }}
          BTV_CLICK_INDEX: ${{ matrix.index }}
        run: node scripts/inspect-btv-winter.mjs
