name: Check TSV Sommer 2026 meeting report PDF structures
on:
  pull_request:
    paths:
      - .github/workflows/btv-2026-reports-pdf-pilot.yml
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Validate four known BTV reports without logging personal data
        run: node scripts/btv-meeting-report-audit.mjs
