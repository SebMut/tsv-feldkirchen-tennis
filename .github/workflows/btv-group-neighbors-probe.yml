name: Check adjacent BTV group references
on:
  pull_request:
    paths:
      - 'scripts/btv-group-neighbors-probe.mjs'
      - '.github/workflows/btv-group-neighbors-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node scripts/btv-group-neighbors-probe.mjs
