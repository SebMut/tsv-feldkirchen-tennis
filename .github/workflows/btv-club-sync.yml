name: BTV club fixture sync

# Four checks daily, at 00:17 / 06:17 / 12:17 / 18:17 UTC.
# GitHub's schedule event only runs on the DEFAULT branch.
# On the protected development branch tests have no Supabase write access.
on:
  push:
    branches:
      - feature/astro-supabase-foundation
    paths:
      - scripts/btv-schedule.mjs
      - scripts/btv-winter-schedule.mjs
      - scripts/sync-btv.mjs
      - scripts/audit-winter-2026.mjs
      - .github/workflows/btv-club-sync.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = validate BTV only; apply is blocked until separately enabled on main'
        required: true
        type: choice
        options: [preview, apply]
        default: preview
      season_year:
        description: 'Optional future summer year (2027+), only after BTV season ID has been verified'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: btv-club-fixtures
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Read verified future summer BTV schedule (optional; no database access)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.season_year != '' && inputs.season_year != '2026' }}
        env:
          BTV_SEASON_YEAR: ${{ inputs.season_year }}
        run: node scripts/sync-btv.mjs
      - name: Cross-check all 15 winter fixtures against the 3 official BTV PDFs (read-only)
        run: node scripts/audit-winter-2026.mjs

  import:
    # No write unless *all* checks hold. This job does not run on the
    # feature branch and has no access to production website hosting.
    if: ${{ (github.event_name == 'schedule' || inputs.mode == 'apply') && github.ref == 'refs/heads/main' && vars.BTV_IMPORT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Check a future verified summer schedule (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.season_year != '' && inputs.season_year != '2026' }}
        env:
          BTV_SEASON_YEAR: ${{ inputs.season_year }}
          BTV_IMPORT_ENABLED: ${{ vars.BTV_IMPORT_ENABLED }}
          SUPABASE_SECRET_KEY: ${{ secrets.BTV_SUPABASE_SECRET_KEY }}
        run: node scripts/sync-btv.mjs --apply
      - name: Check Winter 2026/27 groups and publish verified postponements
        env:
          BTV_SEASON_CODE: winter-2026-2027
          BTV_IMPORT_ENABLED: ${{ vars.BTV_IMPORT_ENABLED }}
          SUPABASE_SECRET_KEY: ${{ secrets.BTV_SUPABASE_SECRET_KEY }}
        run: node scripts/sync-btv.mjs --apply
