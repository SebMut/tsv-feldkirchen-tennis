name: Audit all TSV team BTV group links
on:
  pull_request:
    paths:
      - 'scripts/btv-all-team-group-audit.mjs'
      - '.github/workflows/btv-all-team-group-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node scripts/btv-all-team-group-audit.mjs
