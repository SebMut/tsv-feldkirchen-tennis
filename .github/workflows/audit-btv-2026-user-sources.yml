name: Verify user supplied BTV 2026 match PDFs
on:
  pull_request:
    paths:
      - 'scripts/audit-btv-2026-user-sources.mjs'
      - '.github/workflows/audit-btv-2026-user-sources.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node scripts/audit-btv-2026-user-sources.mjs
