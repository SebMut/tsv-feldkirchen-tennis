name: Publish GitHub Pages Preview

on:
  push:
    branches:
      - feature/astro-supabase-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        env:
          PREVIEW_BASE: /tsv-feldkirchen-tennis
          PUBLIC_PREVIEW_MODE: "true"
        run: npm run build

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
