name: Inspect public BTV winter roster availability
on:
  push:
    branches: [feature/astro-supabase-foundation]
    paths: [scripts/inspect-btv-roster.mjs, .github/workflows/inspect-btv-roster.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        slug: [herren, herren-ii, herren-50]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check public roster presence without collecting names
        env:
          BTV_TEAM_SLUG: ${{ matrix.slug }}
        run: node scripts/inspect-btv-roster.mjs
