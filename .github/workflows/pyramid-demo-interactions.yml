name: Verify Pyramid Demo Interactions

on:
  push:
    branches:
      - feature/forderungspyramide-staging
      - feature/astro-supabase-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  click-test:
    name: Interactive test on desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit regression checks
        run: npm test
      - name: Check production access-link configuration (no emails sent)
        run: |
          set -euo pipefail
          status=$(curl -fsS --connect-timeout 10 --max-time 25 \
            -X POST 'https://eaurnufdochjapfzqwvm.supabase.co/functions/v1/pyramid-access-email' \
            -H 'Origin: https://www.tennis-tsvfeldkirchen.de' \
            -H 'Content-Type: application/json' \
            -d '{"action":"config"}')
          echo "$status" | node -e '
            let input="";
            process.stdin.on("data",c=>input+=c);
            process.stdin.on("end",()=>{
              let x;try{x=JSON.parse(input);}catch{console.error("Invalid mail-service response");process.exit(1);}
              if(!x.enabled||!x.siteKey){console.error("Access link mail not configured: "+(x.message||"unknown"));process.exit(1);}
              console.log("Gmail, Turnstile and Auth access-link endpoint configured.");
            });
          '
      - name: Staging build
        env:
          PREVIEW_BASE: /tsv-feldkirchen-tennis/pyramid-staging
          PUBLIC_PREVIEW_MODE: 'true'
        run: npm run build
      - name: Audit generated site
        env:
          PREVIEW_BASE: /tsv-feldkirchen-tennis/pyramid-staging
          PUBLIC_PREVIEW_MODE: 'true'
        run: npm run audit:site
      - name: Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Test every demo interaction
        env:
          PREVIEW_BASE: /tsv-feldkirchen-tennis/pyramid-staging
          PUBLIC_PREVIEW_MODE: 'true'
        run: node scripts/pyramid-demo-browser-qa.mjs
