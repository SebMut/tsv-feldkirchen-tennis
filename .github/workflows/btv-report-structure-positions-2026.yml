name: Calibrate 2026 BTV single and double PDF parser
on:
  pull_request:
    paths:
      - scripts/btv-report-structure-positions-2026.mjs
      - .github/workflows/btv-report-structure-positions-2026.yml
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node scripts/btv-report-structure-positions-2026.mjs
