name: Deploy Hallenfinder function

on:
  push:
    branches:
      - feature/astro-supabase-foundation
    paths:
      - .github/workflows/deploy-hall-availability.yml
      - supabase/functions/hall-availability/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy hall availability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy public hall availability function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy hall-availability --project-ref eaurnufdochjapfzqwvm --no-verify-jwt --yes
