name: Inspect BTV Sommer 2026 meeting-link discovery
on:
  pull_request:
    paths:
      - scripts/btv-meeting-links-probe-2026.mjs
      - .github/workflows/btv-meeting-links-probe-2026.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btv-meeting-links-probe-2026.mjs
