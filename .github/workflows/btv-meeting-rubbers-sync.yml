name: Sync verified 2026 BTV Einzel and Doppel
on:
  pull_request:
    paths:
      - scripts/btv-meeting-rubbers-parser.mjs
      - scripts/btv-meeting-discovery-core.mjs
      - scripts/btv-meeting-discovery.mjs
      - scripts/btv-meeting-rubbers-import-2026.mjs
      - tests/btv-meeting-discovery.test.mjs
      - tests/btv-meeting-rubbers-parser.test.mjs
      - .github/workflows/btv-meeting-rubbers-sync.yml
  push:
    branches: [main]
    paths:
      - scripts/btv-meeting-rubbers-parser.mjs
      - scripts/btv-meeting-discovery-core.mjs
      - scripts/btv-meeting-discovery.mjs
      - scripts/btv-meeting-rubbers-import-2026.mjs
      - tests/btv-meeting-discovery.test.mjs
      - tests/btv-meeting-rubbers-parser.test.mjs
      - .github/workflows/btv-meeting-rubbers-sync.yml
  workflow_dispatch:
  # Three times each week as requested; missing source IDs remain listed as gaps.
  schedule:
    - cron: '17 3 * * 1,3,5'
permissions:
  contents: read
concurrency:
  group: tsv-2026-official-rubbers-import
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/btv-meeting-rubbers-parser.test.mjs
      - run: node --test tests/btv-meeting-discovery.test.mjs
      - run: node --check scripts/btv-meeting-discovery.mjs
      - run: node --check scripts/btv-meeting-rubbers-import-2026.mjs
  import:
    if: ${{ github.repository == 'SebMut/tsv-feldkirchen-tennis' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install pinned browser tooling (without secrets)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1
          npx --no-install playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Discover official meeting IDs from the authorized BTV cockpit
        # A temporarily unavailable cockpit must not block revalidation of already known reports.
        continue-on-error: true
        env:
          GITHUB_REF: ${{ github.ref }}
          BTV_MEETING_DISCOVERY_WRITE_ENABLED: 'true'
          BTV_LOGIN_USERNAME: ${{ secrets.BTV_LOGIN_USERNAME }}
          BTV_LOGIN_PASSWORD: ${{ secrets.BTV_LOGIN_PASSWORD }}
          BTV_SUPABASE_SECRET_KEY: ${{ secrets.BTV_SUPABASE_SECRET_KEY }}
        run: node scripts/btv-meeting-discovery.mjs --apply
      - name: Import only source-verified 2026 single and double results privately
        env:
          GITHUB_REF: ${{ github.ref }}
          BTV_MEETING_RUBBERS_WRITE_ENABLED: 'true'
          BTV_SUPABASE_SECRET_KEY: ${{ secrets.BTV_SUPABASE_SECRET_KEY }}
        run: node scripts/btv-meeting-rubbers-import-2026.mjs --apply
