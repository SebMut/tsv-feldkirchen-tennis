name: Matchday sync of verified BTV meetings and rubbers
on:
  pull_request:
    paths:
      - scripts/btv-meeting-rubbers-parser.mjs
      - scripts/btv-meeting-discovery-core.mjs
      - scripts/btv-meeting-discovery.mjs
      - scripts/btv-meeting-rubbers-import-2026.mjs
      - scripts/btv-results-import.mjs
      - scripts/btv-results-match.mjs
      - tests/btv-meeting-discovery.test.mjs
      - tests/btv-meeting-rubbers-parser.test.mjs
      - tests/btv-meeting-rubbers-import.test.mjs
      - tests/btv-results-private-import.test.mjs
      - .github/workflows/btv-meeting-rubbers-sync.yml
      - scripts/btv-matchday-window.mjs
      - tests/btv-matchday-window.test.mjs
  push:
    branches: [main]
    paths:
      - scripts/btv-meeting-rubbers-parser.mjs
      - scripts/btv-meeting-discovery-core.mjs
      - scripts/btv-meeting-discovery.mjs
      - scripts/btv-meeting-rubbers-import-2026.mjs
      - scripts/btv-results-import.mjs
      - scripts/btv-results-match.mjs
      - tests/btv-meeting-discovery.test.mjs
      - tests/btv-meeting-rubbers-parser.test.mjs
      - tests/btv-meeting-rubbers-import.test.mjs
      - tests/btv-results-private-import.test.mjs
      - .github/workflows/btv-meeting-rubbers-sync.yml
      - scripts/btv-matchday-window.mjs
      - tests/btv-matchday-window.test.mjs
  workflow_dispatch:
    inputs:
      season_code:
        description: Existing Supabase season code (for example winter-2026-2027)
        required: false
        type: string
  # Every 8 hours, but the import only runs on the two days after a TSV
  # match day (see matchday-window job). Discover meetings first, then
  # refresh every official rubber.
  schedule:
    - cron: '17 */8 * * *'
permissions:
  contents: read
concurrency:
  group: tsv-official-meetings-and-rubbers-import
  cancel-in-progress: false
jobs:
  test:
    # Code is unchanged on scheduled runs; tests run on PRs, pushes and manual runs.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/btv-matchday-window.test.mjs
      - run: node --test tests/btv-meeting-rubbers-parser.test.mjs
      - run: node --test tests/btv-meeting-rubbers-import.test.mjs
      - run: node --test tests/btv-meeting-discovery.test.mjs
      - run: node --test tests/btv-results-private-import.test.mjs
      - run: node --check scripts/btv-results-match.mjs
      - run: node --check scripts/btv-results-import.mjs
      - run: node --check scripts/btv-meeting-discovery.mjs
      - run: node --check scripts/btv-meeting-rubbers-import-2026.mjs
  matchday-window:
    # Scheduled runs only sync on the two Berlin days after a TSV match day.
    if: ${{ github.repository == 'SebMut/tsv-feldkirchen-tennis' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - id: window
        name: Check matchday follow-up window
        env:
          BTV_SUPABASE_SECRET_KEY: ${{ secrets.BTV_SUPABASE_SECRET_KEY }}
        run: node scripts/btv-matchday-window.mjs
  import:
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.matchday-window.outputs.active == 'true' && github.repository == 'SebMut/tsv-feldkirchen-tennis' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: [test, matchday-window]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Import verified final team results
        env:
          BTV_RESULTS_WRITE_ENABLED: 'true'
          BTV_SUPABASE_SECRET_KEY: ${{ secrets.BTV_SUPABASE_SECRET_KEY }}
        run: node scripts/btv-results-import.mjs --apply
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.64.1-${{ runner.os }}
      - name: Install pinned browser tooling (without secrets)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1
          npx --no-install playwright install --with-deps chromium
      - name: Discover official meeting IDs from BTV cockpit and public group reports
        # A temporarily unavailable BTV surface must not block revalidation of already known reports.
        continue-on-error: true
        env:
          GITHUB_REF: ${{ github.ref }}
          BTV_MEETING_DISCOVERY_WRITE_ENABLED: 'true'
          BTV_LOGIN_USERNAME: ${{ secrets.BTV_LOGIN_USERNAME }}
          BTV_LOGIN_PASSWORD: ${{ secrets.BTV_LOGIN_PASSWORD }}
          BTV_SUPABASE_SECRET_KEY: ${{ secrets.BTV_SUPABASE_SECRET_KEY }}
          BTV_SEASON_CODE: ${{ inputs.season_code || vars.BTV_ACTIVE_SEASON_CODE || 'winter-2026-2027' }}
        run: node scripts/btv-meeting-discovery.mjs --apply
      - name: Import source-verified single and double results privately
        env:
          GITHUB_REF: ${{ github.ref }}
          BTV_MEETING_RUBBERS_WRITE_ENABLED: 'true'
          BTV_SUPABASE_SECRET_KEY: ${{ secrets.BTV_SUPABASE_SECRET_KEY }}
          BTV_SEASON_CODE: ${{ inputs.season_code || vars.BTV_ACTIVE_SEASON_CODE || 'winter-2026-2027' }}
        run: node scripts/btv-meeting-rubbers-import-2026.mjs --apply
