name: Deploy to United Domains

on:
  workflow_dispatch:
    inputs:
      final_approval:
        description: "Nur NACH ausdrücklicher separater Go-live-Freigabe: TSV-FELDKIRCHEN-GO-LIVE"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    # Beides ist notwendig: manuelles Freigabewort UND explizit gesetzte Repository-Variable.
    # Ein leerer/fehlender Wert lässt diesen Job immer ausfallen (keine SFTP-Verbindung).
    if: ${{ github.ref == 'refs/heads/feature/astro-supabase-foundation' && inputs.final_approval == 'TSV-FELDKIRCHEN-GO-LIVE' && vars.TSV_GO_LIVE_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          PREVIEW_BASE: /
          PUBLIC_PREVIEW_MODE: 'false'
      - name: Verify production and admin pages
        run: |
          npm run audit:site
          test -f dist/index.html
          test -f dist/admin/index.html
          test -f dist/.htaccess
          grep -Fq 'DirectoryIndex index.html index.php' dist/.htaccess
          grep -Fq 'https://www.tennis-tsvfeldkirchen.de' dist/index.html
          if grep -Fq 'noindex,nofollow' dist/index.html; then exit 1; fi
          grep -Fq 'noindex,nofollow' dist/admin/index.html
          grep -Fq 'Sitemap: https://www.tennis-tsvfeldkirchen.de/sitemap.xml' dist/robots.txt
        env:
          PREVIEW_BASE: /
          PUBLIC_PREVIEW_MODE: 'false'
      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Upload dist via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          test -n "$SFTP_HOST"
          test -n "$SFTP_USER"
          test -n "$SFTP_PASSWORD"
          test -n "$SFTP_REMOTE_PATH"
          PORT="${SFTP_PORT:-22}"
          # Die versteckte Apache-Konfiguration ist NICHT in dist/* enthalten.
          test -f dist/.htaccess
          test -f dist/admin/index.html
          printf 'cd %s\nput -r dist/*\nput dist/.htaccess .htaccess\nbye\n' "$SFTP_REMOTE_PATH" > /tmp/sftp-batch.txt
          sshpass -p "$SFTP_PASSWORD" sftp -o StrictHostKeyChecking=accept-new -P "$PORT" -b /tmp/sftp-batch.txt "$SFTP_USER@$SFTP_HOST"
