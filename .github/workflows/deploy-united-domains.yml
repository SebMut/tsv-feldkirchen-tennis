name: Deploy to United Domains

on:
  push:
    branches:
      - feature/astro-supabase-foundation
    paths:
      - .github/workflows/deploy-united-domains.yml
  workflow_dispatch:
    inputs:
      final_approval:
        description: "Nur NACH ausdrücklicher separater Go-live-Freigabe: TSV-FELDKIRCHEN-GO-LIVE"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[hosting-preflight]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Verify SFTP secrets exist without disclosing their values
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -eu
          test -n "$SFTP_HOST" || { echo '::error::SFTP_HOST is missing'; exit 1; }
          test -n "$SFTP_USER" || { echo '::error::SFTP_USER is missing'; exit 1; }
          test -n "$SFTP_PASSWORD" || { echo '::error::SFTP_PASSWORD is missing'; exit 1; }
          test -n "$SFTP_REMOTE_PATH" || { echo '::error::SFTP_REMOTE_PATH is missing'; exit 1; }
          echo 'All required SFTP secrets are present.'
      - name: Install SFTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      # Verify the existing remote directory without uploading, deleting or editing files.
      # The remote pwd/ls output must be inspected before any separate production approval.
      - name: Read-only SFTP directory test
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -eu
          PORT="$SFTP_PORT"
          if [ -z "$PORT" ]; then PORT=22; fi
          printf 'cd %s\npwd\nls -la\nbye\n' "$SFTP_REMOTE_PATH" > /tmp/tsv-preflight.sftp
          export SSHPASS="$SFTP_PASSWORD"
          timeout 45 sshpass -e sftp -o BatchMode=no -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -P "$PORT" -b /tmp/tsv-preflight.sftp "$SFTP_USER@$SFTP_HOST"
          echo 'Read-only SFTP preflight successful. No files changed.'

  deploy:
    # Beides ist notwendig: manuelles Freigabewort UND explizit gesetzte Repository-Variable.
    # Ein leerer/fehlender Wert lässt diesen Job immer ausfallen (keine SFTP-Verbindung).
    if: ${{ github.ref == 'refs/heads/feature/astro-supabase-foundation' && vars.TSV_GO_LIVE_APPROVED == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.final_approval == 'TSV-FELDKIRCHEN-GO-LIVE') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[hosting-deploy-approved]'))) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          PREVIEW_BASE: /
          PUBLIC_PREVIEW_MODE: 'false'
      - name: Verify production and admin pages
        run: |
          npm run audit:site
          test -f dist/index.html
          test -f dist/admin/index.html
          test -f dist/.htaccess
          grep -Fq 'DirectoryIndex index.html index.php' dist/.htaccess
          grep -Fq 'https://www.tennis-tsvfeldkirchen.de' dist/index.html
          if grep -Fq 'noindex,nofollow' dist/index.html; then exit 1; fi
          grep -Fq 'noindex,nofollow' dist/admin/index.html
          grep -Fq 'Sitemap: https://www.tennis-tsvfeldkirchen.de/sitemap.xml' dist/robots.txt
        env:
          PREVIEW_BASE: /
          PUBLIC_PREVIEW_MODE: 'false'
      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Upload dist via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          test -n "$SFTP_HOST"
          test -n "$SFTP_USER"
          test -n "$SFTP_PASSWORD"
          test -n "$SFTP_REMOTE_PATH"
          case "$SFTP_REMOTE_PATH" in /|.|..|'') echo 'Unsafe remote folder'; exit 1;; esac
          PORT="${SFTP_PORT:-22}"
          # Die versteckte Apache-Konfiguration ist NICHT in dist/* enthalten.
          test -f dist/.htaccess
          test -f dist/admin/index.html
          # Verify the delivered root and admin entrypoints on the remote host.
          printf 'cd %s\nput -r dist/*\nput dist/.htaccess .htaccess\nls -l index.html\nls -l admin/index.html\nbye\n' "$SFTP_REMOTE_PATH" > /tmp/sftp-batch.txt
          export SSHPASS="$SFTP_PASSWORD"
          timeout 240 sshpass -e sftp -o BatchMode=no -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -P "$PORT" -b /tmp/sftp-batch.txt "$SFTP_USER@$SFTP_HOST"
      - name: Verify live website and login shell via HTTPS
        run: |
          set -euo pipefail
          domain='https://www.tennis-tsvfeldkirchen.de'
          for attempt in 1 2 3 4 5; do
            home=$(curl -fsSL --connect-timeout 10 --max-time 30 "$domain/" || true)
            admin=$(curl -fsSL --connect-timeout 10 --max-time 30 "$domain/admin/" || true)
            if echo "$home" | grep -Fq 'TSV Feldkirchen Tennis' && echo "$admin" | grep -Fq 'id="auth-box"'; then
              echo 'Public front page and protected admin login HTML are served at the live domain.'
              exit 0
            fi
            echo "Deployment visibility check $attempt/5: domain may still be propagating."
            sleep 10
          done
          echo '::error::Production domain did not serve both the new Astro front page and /admin/. Verify United Domains domain folder/SSL mapping.'
          exit 1
