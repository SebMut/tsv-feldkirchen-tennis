name: Deploy to United Domains

on:
  push:
    branches:
      - feature/astro-supabase-foundation
    paths:
      - .github/workflows/deploy-united-domains.yml
  workflow_dispatch:
    inputs:
      final_approval:
        description: "Nur NACH ausdrücklicher separater Go-live-Freigabe: TSV-FELDKIRCHEN-GO-LIVE"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[hosting-preflight]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Verify SFTP secrets exist without disclosing their values
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -eu
          test -n "$SFTP_HOST" || { echo '::error::SFTP_HOST is missing'; exit 1; }
          test -n "$SFTP_USER" || { echo '::error::SFTP_USER is missing'; exit 1; }
          test -n "$SFTP_PASSWORD" || { echo '::error::SFTP_PASSWORD is missing'; exit 1; }
          test -n "$SFTP_REMOTE_PATH" || { echo '::error::SFTP_REMOTE_PATH is missing'; exit 1; }
          echo 'All required SFTP secrets are present.'
      - name: Install SFTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      # Verify the existing remote directory without uploading, deleting or editing files.
      # The remote pwd/ls output must be inspected before any separate production approval.
      - name: Read-only SFTP directory test
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -eu
          PORT="$SFTP_PORT"
          if [ -z "$PORT" ]; then PORT=22; fi
          printf 'cd %s\npwd\nls -l .\nls -l _astro\n-df -h .\n-df -h _astro\nbye\n' "$SFTP_REMOTE_PATH" > /tmp/tsv-preflight.sftp
          export SSHPASS="$SFTP_PASSWORD"
          timeout 45 sshpass -e sftp -o BatchMode=no -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -P "$PORT" -b /tmp/tsv-preflight.sftp "$SFTP_USER@$SFTP_HOST"
          echo 'Read-only SFTP preflight successful. No files changed.'
      - name: Verify hidden live route, admin modal, no public link and built assets via HTTPS
        run: |
          set -euo pipefail
          domain='https://www.tennis-tsvfeldkirchen.de'
          curl -fsSL --connect-timeout 10 --max-time 30 "$domain/forderungspyramide/?tsv-check=$GITHUB_SHA" -o /tmp/pyramid-live.html
          curl -fsSL --connect-timeout 10 --max-time 30 "$domain/admin/?tsv-check=$GITHUB_SHA" -o /tmp/admin-live.html
          curl -fsSL --connect-timeout 10 --max-time 30 "$domain/?tsv-check=$GITHUB_SHA" -o /tmp/home-live.html
          curl -fsSL --connect-timeout 10 --max-time 30 "$domain/sitemap.xml" -o /tmp/sitemap-live.xml
          grep -Fq 'id="pyramid-login-form"' /tmp/pyramid-live.html
          grep -Fq 'noindex,nofollow' /tmp/pyramid-live.html
          grep -Fq 'id="pyramid-admin-result-dialog"' /tmp/admin-live.html
          if grep -Fq 'href="/forderungspyramide/"' /tmp/home-live.html; then echo '::error::Unexpected public navigation link to pyramid'; exit 1; fi
          if grep -Fq '/forderungspyramide/' /tmp/sitemap-live.xml; then echo '::error::Pyramid must not be indexed'; exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          html=Path('/tmp/pyramid-live.html').read_text(encoding='utf-8')
          assets=list(dict.fromkeys(re.findall(r'(?:src|href)="(/_astro/[^"]+\.(?:js|css))"',html)))
          if not assets: raise SystemExit('Pyramid has no referenced JS/CSS assets')
          for asset in assets:
              subprocess.run(['curl','-fsSL','--connect-timeout','10','--max-time','30',
                  '-o','/dev/null','https://www.tennis-tsvfeldkirchen.de'+asset],check=True)
          print('Verified live hidden pyramid route, private login, admin score dialog, no public nav/sitemap and',len(assets),'assets.')
          PY

  write_diagnostic:
    # One-shot user-approved test: clean up temporary file and directory.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[hosting-write-test]') && vars.TSV_GO_LIVE_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Install SFTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check creation permissions without touching existing files
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -eu
          test -n "$SFTP_HOST" && test -n "$SFTP_USER" && test -n "$SFTP_PASSWORD" && test -n "$SFTP_REMOTE_PATH"
          PORT="${SFTP_PORT:-22}"
          printf 'TSV write permission diagnostic, no personal content\n' > /tmp/tsv-sftp-write-test.txt
          TEST_FILE=".tsv-sftp-write-test-$GITHUB_RUN_ID"
          TEST_DIR=".tsv-sftp-mkdir-test-$GITHUB_RUN_ID"
          printf 'cd %s\n-df -hi .\nput /tmp/tsv-sftp-write-test.txt %s\nls -l %s\nrm %s\nmkdir %s\nrmdir %s\nbye\n' \
            "$SFTP_REMOTE_PATH" "$TEST_FILE" "$TEST_FILE" "$TEST_FILE" "$TEST_DIR" "$TEST_DIR" > /tmp/tsv-write-test.sftp
          export SSHPASS="$SFTP_PASSWORD"
          timeout 45 sshpass -e sftp -o BatchMode=no -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -P "$PORT" -b /tmp/tsv-write-test.sftp "$SFTP_USER@$SFTP_HOST"
          echo 'SFTP successfully created and removed a temporary file and directory.'

  deploy:
    # Beides ist notwendig: manuelles Freigabewort UND explizit gesetzte Repository-Variable.
    # Ein leerer/fehlender Wert lässt diesen Job immer ausfallen (keine SFTP-Verbindung).
    if: ${{ github.ref == 'refs/heads/feature/astro-supabase-foundation' && vars.TSV_GO_LIVE_APPROVED == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.final_approval == 'TSV-FELDKIRCHEN-GO-LIVE') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[hosting-deploy-approved]'))) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          PREVIEW_BASE: /
          PUBLIC_PREVIEW_MODE: 'false'
      - name: Verify production and admin pages
        run: |
          npm run audit:site
          test -f dist/index.html
          test -f dist/admin/index.html
          test -f dist/forderungspyramide/index.html
          grep -Fq 'id="pyramid-public-board"' dist/forderungspyramide/index.html
          grep -Fq 'id="pyramid-public-select"' dist/forderungspyramide/index.html
          grep -Fq 'id="pyramid-rules-heading"' dist/forderungspyramide/index.html
          grep -Fq 'pyramid-rules-list' dist/forderungspyramide/index.html
          grep -Fq 'id="pyramid-access-turnstile-widget"' dist/forderungspyramide/index.html
          grep -Fq 'id="pyramid-password-setup"' dist/forderungspyramide/index.html
          grep -Fq 'id="pyramid-password-setup-form"' dist/forderungspyramide/index.html
          grep -Fq 'Passwort-Link per E-Mail' dist/forderungspyramide/index.html
          grep -Fq 'id="pyramid-password-change"' dist/forderungspyramide/index.html
          grep -Fq 'Jetzt Teilnahme beantragen' dist/forderungspyramide/index.html
          grep -Fq 'id="pyramid-avatar-save-state"' dist/forderungspyramide/index.html
          grep -Fq 'id="pyramid-avatar-panel"' dist/forderungspyramide/index.html
          grep -Fq 'id="pyramid-avatar-file"' dist/forderungspyramide/index.html
          grep -Fq 'id="pyramid-neutral-reason"' dist/forderungspyramide/index.html
          grep -Fq 'Urlaub (maximal 28 Tage)' dist/forderungspyramide/index.html
          grep -Fq 'Ergebnis zur Bestätigung melden' dist/forderungspyramide/index.html
          grep -Fq '1. Mai bis 30. September' dist/forderungspyramide/index.html
          grep -Fq 'id="pyramid-auth"' dist/forderungspyramide/index.html
          grep -Fq 'noindex,nofollow' dist/forderungspyramide/index.html
          test -f dist/.htaccess
          grep -Fq 'DirectoryIndex index.html index.php' dist/.htaccess
          test -f dist/datenschutz/index.html
          if grep -Eq '^[[:space:]]*(Redirect|RedirectMatch)[[:space:]]+30[1278][[:space:]]+/datenschutz/?[[:space:]]+' dist/.htaccess; then
            echo '::error::Privacy page cannot be redirected to the main club'
            exit 1
          fi
          grep -Fq 'Datenschutzerklärung' dist/datenschutz/index.html
          grep -Fq 'https://www.tennis-tsvfeldkirchen.de' dist/index.html
          if grep -Fq 'noindex,nofollow' dist/index.html; then exit 1; fi
          grep -Fq 'noindex,nofollow' dist/admin/index.html
          grep -Fq 'Sitemap: https://www.tennis-tsvfeldkirchen.de/sitemap.xml' dist/robots.txt
        env:
          PREVIEW_BASE: /
          PUBLIC_PREVIEW_MODE: 'false'
      - name: Prepare verified SFTP uploader
        run: |
          python3 -m py_compile scripts/deploy-sftp.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv
          python3 -m venv /tmp/tsv-sftp-venv
          /tmp/tsv-sftp-venv/bin/pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Upload, create missing folders and verify all SFTP files
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -eu
          test -n "$SFTP_HOST"
          test -n "$SFTP_USER"
          test -n "$SFTP_PASSWORD"
          test -n "$SFTP_REMOTE_PATH"
          test -f dist/.htaccess
          test -f dist/admin/index.html
          test -f dist/forderungspyramide/index.html
          timeout 300 /tmp/tsv-sftp-venv/bin/python scripts/deploy-sftp.py
      # Explicit go-live approval was confirmed after successful read-only SFTP checks.
      # Approved user-management hotfix: authenticated invites and permission saves.
      # Approved responsive top-dropdown navigation for administration.
      # Production hotfix: outgoing access email redirects remain on the live domain.
      # UX-reviewed admin navigation: one-line menus, active section, mobile picker.
      # Final verified UX patch: prevent tablet header overflow near 1024px.
      # Role-safe user rights overview, UI verified in desktop/mobile Chromium.
      # Self-service individual rights, with test-gated deployment and intact RLS.
      # Identical saved-permissions cards for signed-in users and SuperAdmin.
      # Privacy-friendly website analytics with SuperAdmin-only reports and domain-restricted counting.
      # Three responsive cards per desktop row on Aktuelles; all browser, build and audit checks passed.
      # Combine event and news cards into one actual three-column feed and reduce all page heading sizes; browser QA passed.
      # Publish four configurable RSVP sections, an upfront signup CTA and Turnstile error recovery; CI and browser QA passed.
      # Ship alphabetically sorted A4 landscape RSVP PDF tables: verified admin records, food, cake, adults and kids, repeated page headers.
      # Prominent event registrations and PDF exports page: one verified-download button per event, guarded by existing events permissions.
      # Release TSV corporate-identity PDF: existing Supabase club logo, club-red headers, repeated letterhead, private verified reports; browser and build QA passed.
      # Publish tested homepage image priority: event hero, linked News hero (including Christmas party), technical fallback; deduplicated and browser-QA verified.
      # Publish expanded Tennis privacy information for Supabase, registration, Gmail, Turnstile, hosting, ICS, analytics and rights, after browser QA.
      # Fix global Datenschutz footer href to local Tennis policy instead of external main club; tested in responsive browser QA.
      # User-approved hidden Forderungspyramide rollout: private login, delegated admin, modal results, guarded SQL/RLS and Gmail queue; browser QA passed.
      # Master v1.0: 14-day play / 3-day desired scheduling / 48h confirmed results / 7-day cooldowns / 28-day automatic un-neutralization; bottom-right Urlaub/Verletzung badges; desktop/mobile/small mobile QA green.
      # Password onboarding: email link -> verifyOtp -> updateUser -> open pyramid request form, tested with isolated synthetic browser account.
      # Auth delivery repair: GoTrue opaque tokens, honest resend status, server-error email cooldown refund. Build and desktop/mobile QA passed.
      - name: Verify live website and login shell via HTTPS
        run: |
          set -euo pipefail
          domain='https://www.tennis-tsvfeldkirchen.de'
          # The ?policy-check=... variant also avoids old browser/proxy caches
          # of the removed permanent 301 response.
          privacy_redirect=$(curl -sS -o /tmp/tsv-privacy.html -w '%{http_code}|%{redirect_url}' --connect-timeout 10 --max-time 30 "$domain/datenschutz/?policy-check=${GITHUB_SHA}" || true)
          case "$privacy_redirect" in
            200\|) grep -Fq 'Datenschutzerklärung' /tmp/tsv-privacy.html ;;
            *) echo "::error::Datenschutz still redirects or is unavailable: $privacy_redirect"; exit 1 ;;
          esac
          for attempt in 1 2 3 4 5; do
            home=$(curl -fsSL --connect-timeout 10 --max-time 30 "$domain/" || true)
            admin=$(curl -fsSL --connect-timeout 10 --max-time 30 "$domain/admin/" || true)
            pyramid=$(curl -fsSL --connect-timeout 10 --max-time 30 "$domain/forderungspyramide/?release-check=$GITHUB_SHA" || true)
            # Here-strings avoid SIGPIPE false negatives when grep -q finds a
            # marker early in the now larger generated admin/pyramid HTML.
            if grep -Fq 'TSV Feldkirchen Tennis' <<<"$home" && grep -Fq 'id="auth-box"' <<<"$admin" &&
               grep -Fq 'id="pyramid-login-form"' <<<"$pyramid" &&
               grep -Fq 'id="pyramid-public-board"' <<<"$pyramid" &&
               grep -Fq 'id="pyramid-rules-heading"' <<<"$pyramid" &&
               grep -Fq 'id="pyramid-access-turnstile-widget"' <<<"$pyramid" &&
               grep -Fq 'id="pyramid-password-setup-form"' <<<"$pyramid" &&
               grep -Fq 'Passwort-Link per E-Mail' <<<"$pyramid" &&
               grep -Fq 'id="pyramid-password-change"' <<<"$pyramid" &&
               grep -Fq 'Jetzt Teilnahme beantragen' <<<"$pyramid" &&
               grep -Fq 'id="pyramid-avatar-save-state"' <<<"$pyramid" &&
               grep -Fq 'id="pyramid-avatar-panel"' <<<"$pyramid" &&
               grep -Fq 'id="pyramid-avatar-file"' <<<"$pyramid" &&
               grep -Fq 'id="pyramid-neutral-reason"' <<<"$pyramid" &&
               grep -Fq 'Urlaub (maximal 28 Tage)' <<<"$pyramid" &&
               grep -Fq 'Ergebnis zur Bestätigung melden' <<<"$pyramid" &&
               grep -Fq 'noindex,nofollow' <<<"$pyramid"; then
              missing=0
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                code=$(curl -sSL -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 25 "$domain$asset" || true)
                if [ "$code" != "200" ]; then
                  echo "::error::Referenced pyramid JS/CSS asset not served: $asset HTTP $code"
                  missing=1
                fi
              done < <(printf '%s' "$pyramid" | grep -oE '/_astro/[^"<> ]+\.(js|css)' | sort -u)
              [ "$missing" -eq 0 ] || exit 1
              echo 'Production homepage, protected admin login and hidden /forderungspyramide/ (noindex) plus its JS/CSS are served.'
              exit 0
            fi
            echo "Deployment visibility check $attempt/5: domain may still be propagating."
            sleep 10
          done
          echo '::error::Production domain did not serve both the new Astro front page and /admin/. Verify United Domains domain folder/SSL mapping.'
          exit 1
