name: Migrate Legacy Media

on:
  workflow_dispatch:
  push:
    branches:
      - feature/astro-supabase-foundation
    paths:
      - .github/workflows/migrate-legacy-media.yml

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Copy allowlisted WordPress assets into Supabase Storage
        run: |
          curl --fail-with-body --retry 2 --request POST \
            https://eaurnufdochjapfzqwvm.supabase.co/functions/v1/migrate-legacy-media \
            --header "content-type: application/json" \
            --data '{}'
