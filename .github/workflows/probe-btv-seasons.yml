name: Probe BTV public season discovery
on:
  workflow_dispatch:
  push:
    branches: [feature/astro-supabase-foundation]
    paths: [scripts/probe-btv-seasons.mjs, .github/workflows/probe-btv-seasons.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/probe-btv-seasons.mjs
