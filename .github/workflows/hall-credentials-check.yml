name: Hallenfinder login data check

on:
  push:
    branches:
      - feature/astro-supabase-foundation
    paths:
      - .github/workflows/hall-credentials-check.yml
      - scripts/check-hall-credentials.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    name: Check protected hall logins
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: hallenfinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check that every required login is configured
        env:
          HALL_EVERSPORTS_EMAIL: ${{ secrets.HALL_EVERSPORTS_EMAIL }}
          HALL_EVERSPORTS_PASSWORD: ${{ secrets.HALL_EVERSPORTS_PASSWORD }}
          HALL_ASCHHEIM_USERNAME: ${{ secrets.HALL_ASCHHEIM_USERNAME }}
          HALL_ASCHHEIM_PASSWORD: ${{ secrets.HALL_ASCHHEIM_PASSWORD }}
          HALL_KIRCHHEIM_USERNAME: ${{ secrets.HALL_KIRCHHEIM_USERNAME }}
          HALL_KIRCHHEIM_PASSWORD: ${{ secrets.HALL_KIRCHHEIM_PASSWORD }}
        run: node scripts/check-hall-credentials.mjs
